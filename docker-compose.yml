# Dependências de desenvolvimento. A porta 5433 evita conflito com um
# PostgreSQL instalado localmente na 5432.
name: central-manutencao

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: central
      POSTGRES_PASSWORD: central
      POSTGRES_DB: central
      TZ: UTC
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U central -d central']
      interval: 2s
      timeout: 3s
      retries: 30

  # Captura os e-mails enviados em desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
